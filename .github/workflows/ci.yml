name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and contract test dependencies
        run: python -m pip install requests beautifulsoup4 jsonschema fastapi httpx
      - name: Validate automatic Agent and public publication contracts
        run: >-
          python -m unittest
          agent_v3.tests.test_runtime16
          agent_v3.tests.test_library15 agent_v3.tests.test_public_site agent_v3.tests.test_automation13
          agent_v3.tests.test_risk_and_comments agent_v3.tests.test_quality
          agent_v3.tests.test_browser_tools agent_v3.tests.test_main_agent
          agent_v3.tests.test_web_research agent_v3.tests.test_deepseek
          agent_v3.tests.test_research_tracking agent_v3.tests.test_public_sources
          agent_v3.tests.test_space_bunny agent_v3.tests.test_delivery
          agent_v3.tests.test_zen agent_v3.tests.test_continuity agent_v3.tests.test_v3
          agent_v2.tests.test_core agent_v2.tests.test_operations agent_v2.tests.test_model
          runtime.tests.test_pipeline_health L4_intelligence.tests.test_creative_delivery
          L4_intelligence.tests.test_llm -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for API regression checks
        run: python -m pip install requests beautifulsoup4 jsonschema fastapi httpx

      # Optional LangGraph integration is skipped when its runtime is absent.
      - name: Run unit tests per layer
        run: |
          python -m unittest discover -s L3_semantic/tests -p "test_*.py"
          python -m unittest discover -s L3_trend/tests -p "test_*.py"
          python -m unittest discover -s L4_intelligence/tests -p "test_*.py"
          python -m unittest discover -s L5_memory/tests -p "test_*.py"
          python -m unittest discover -s L6_execution/tests -p "test_*.py"
          python -m unittest discover -s runtime/tests -p "test_*.py"
          python -m unittest discover -s games/tests -p "test_*.py"

      # 2026-09-29 事故复盘后新增：原始域 CSV 曾因 .gitignore 规则与实际目录名
      # 不匹配（02数据_*/ vs 02数据/）而被推送到公开仓库。扫描升级为
      # 「所有被 git 跟踪的文件」+ 排除代码/文档自身的字段名提及，防复发。
      - name: PII guard — no plaintext identity columns in ANY tracked file
        run: |
          set -e
          HIT=0
          while IFS= read -r f; do
            # 只扫 CSV，代码/文档里出现字段名是正常引用
            case "$f" in *.csv) ;; *) continue ;; esac
            if head -1 "$f" | grep -qE "(^|,)(user_name|user_id|avatar_url)(,|$)"; then
              echo "::error file=$f::PII 明文字段出现在被跟踪的 CSV 中: $f"
              HIT=1
            fi
          done < <(git ls-files)
          if [ "$HIT" -ne 0 ]; then
            echo "存在含明文身份字段的被跟踪 CSV，请先清洗或移出版本库"
            exit 1
          fi
          echo "PII guard: 通过（所有被跟踪 CSV 均不含 user_name/user_id/avatar_url 列）"
